[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[project]
name = "micro-rts-rs"
version = "0.1.0"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["gymnasium>=0.28,<2", "numpy>=1.24", "pettingzoo>=1.24,<2"]

[project.optional-dependencies]
policy = ["torch>=2.6"]
test = ["pytest>=8,<9"]

[project.scripts]
micro-rts-eval = "micro_rts_rs.evaluate:main"

[tool.maturin]
manifest-path = "crates/python/Cargo.toml"
python-source = "python"
module-name = "micro_rts_rs._native"
features = ["pyo3/extension-module"]
include = ["python/micro_rts_rs/GridNetBridge.java", "THIRD_PARTY_NOTICES.md"]
exclude = ["**/__pycache__/**", "**/*.pyc"]
